[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkness-le"
version = "0.1.0"
description = "Solar axion flux and coherent axion-photon conversion utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
py-modules = ["solar_flux", "conversion"]
