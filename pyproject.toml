[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkness-le"
version = "0.1.0"
description = "Solar axion flux and coherent axion-photon conversion utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "astropy>=6.0",
    "matplotlib>=3.9",
    "pymsis>=0.12,<0.13",
    "xraylib>=4.2,<5",
]

[tool.setuptools]
packages = ["functions", "functions.background"]

[tool.setuptools.package-data]
functions = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["pytests"]
pythonpath = ["."]
markers = ["reference: needs a published reference value (not yet sourced)"]
